name: Brazil SEO and UX smoke audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'localizacao-ptbr.js'
      - 'tests/seo-smoke.mjs'
      - '.github/workflows/seo-audit.yml'

permissions:
  contents: read

jobs:
  smoke-and-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test requirements
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static site server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/seo-site.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/ -o /dev/null && break; sleep 1; done
      - name: Functional and responsive smoke tests
        run: node tests/seo-smoke.mjs
      - name: Lighthouse lab audit (mobile)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p artifacts
          export CHROME_PATH="$(node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")"
          npx --yes lighthouse@12.8.2 http://127.0.0.1:8080/ --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=artifacts/lighthouse-mobile.json --only-categories=performance,seo,accessibility
          node --input-type=module -e "import fs from 'node:fs'; const d=JSON.parse(fs.readFileSync('artifacts/lighthouse-mobile.json')); console.log(JSON.stringify({scores:Object.fromEntries(Object.entries(d.categories).map(([k,v])=>[k,v.score])),metrics:Object.fromEntries(['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift'].map(k=>[k,d.audits[k]?.displayValue])),diagnostics:d.audits['render-blocking-resources']?.details?.items?.length},null,2));"
      - name: Upload browser screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-ux-audit
          path: artifacts/
          if-no-files-found: ignore
