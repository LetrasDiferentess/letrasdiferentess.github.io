name: US Library Virtual Silo QA

on:
  pull_request:
    paths:
      - 'us/library/**'
      - 'tests/library-smoke.mjs'
      - '.github/workflows/library-smoke.yml'
      - 'us/index.html'
      - 'sitemap.xml'
  push:
    branches: [main]
    paths:
      - 'us/library/**'
      - 'tests/library-smoke.mjs'
      - '.github/workflows/library-smoke.yml'

permissions:
  contents: read

jobs:
  library-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          if ! command -v google-chrome >/dev/null 2>&1; then npx playwright install chromium; fi
      - name: Start local Pages mirror
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/library-site.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/us/library/ -o /dev/null && break; sleep 1; done
      - name: Validate categories, anchors, search, mobile and desktop
        run: |
          if command -v google-chrome >/dev/null 2>&1; then USE_SYSTEM_CHROME=1 node tests/library-smoke.mjs; else node tests/library-smoke.mjs; fi
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-library-qa
          path: artifacts/
          if-no-files-found: ignore
