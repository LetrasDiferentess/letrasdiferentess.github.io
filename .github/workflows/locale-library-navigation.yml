name: Locale Tool Links and Library Navigation
on:
  pull_request:
    paths:
      - 'index.html'
      - 'us/index.html'
      - 'us/library/index.html'
      - 'assets/locale-library-nav.css'
      - 'tests/locale-navigation-smoke.mjs'
      - '.github/workflows/locale-library-navigation.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'us/index.html'
      - 'us/library/index.html'
      - 'assets/locale-library-nav.css'
      - 'tests/locale-navigation-smoke.mjs'
      - '.github/workflows/locale-library-navigation.yml'
permissions:
  contents: read
jobs:
  cross-locale-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          if ! command -v google-chrome >/dev/null 2>&1; then npx playwright install chromium; fi
      - name: Serve static pages
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/locale-audit-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/us/library/ -o /dev/null && break; sleep 1; done
      - name: Check both local pages, links, responsive layout and library logo
        run: |
          if command -v google-chrome >/dev/null 2>&1; then USE_SYSTEM_CHROME=1 node tests/locale-navigation-smoke.mjs; else node tests/locale-navigation-smoke.mjs; fi
