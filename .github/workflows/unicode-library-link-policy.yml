name: Unicode Library URL Lock and Link Policy
on:
  push:
    branches: [main]
    paths:
      - 'data/unicode-library-96.lock.json'
      - 'docs/UNICODE_LIBRARY_LINK_POLICY.md'
      - 'AGENTS.md'
      - 'scripts/check-unicode-library-links.mjs'
      - 'scripts/test-unicode-library-links.mjs'
      - 'scripts/test-unicode-batch3.mjs'
      - 'scripts/test-unicode-batch4.mjs'
      - 'scripts/test-unicode-batch5.mjs'
      - 'scripts/test-unicode-batch6.mjs'
      - 'scripts/test-unicode-batch7.mjs'
      - 'scripts/test-unicode-batch8.mjs'
      - 'scripts/test-unicode-batch9.mjs'
      - 'scripts/test-unicode-batch10.mjs'
      - 'scripts/test-unicode-batch11.mjs'
      - '.github/workflows/unicode-library-link-policy.yml'
      - 'us/**'
  pull_request:
    paths:
      - 'data/unicode-library-96.lock.json'
      - 'docs/UNICODE_LIBRARY_LINK_POLICY.md'
      - 'AGENTS.md'
      - 'scripts/check-unicode-library-links.mjs'
      - 'scripts/test-unicode-library-links.mjs'
      - 'scripts/test-unicode-batch3.mjs'
      - 'scripts/test-unicode-batch4.mjs'
      - 'scripts/test-unicode-batch5.mjs'
      - 'scripts/test-unicode-batch6.mjs'
      - 'scripts/test-unicode-batch7.mjs'
      - 'scripts/test-unicode-batch8.mjs'
      - 'scripts/test-unicode-batch9.mjs'
      - 'scripts/test-unicode-batch10.mjs'
      - 'scripts/test-unicode-batch11.mjs'
      - '.github/workflows/unicode-library-link-policy.yml'
      - 'us/**'
permissions:
  contents: read
jobs:
  verify-url-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check locked URL list and links in published articles
        run: node scripts/check-unicode-library-links.mjs
      - name: Verify guards against invented URLs, GPT tracking and external nofollow violations
        run: node --test scripts/test-unicode-library-links.mjs
      - name: Verify Batch 3 Unicode data and normalization examples
        run: node --test scripts/test-unicode-batch3.mjs
      - name: Verify Batch 4 encoding vectors and publication invariants
        run: node --test scripts/test-unicode-batch4.mjs
      - name: Verify Batch 5 UTF integrity, escapes and NFC/NFD examples
        run: node --test scripts/test-unicode-batch5.mjs
      - name: Verify Batch 6 normalization and casing research vectors
        run: node --test scripts/test-unicode-batch6.mjs
      - name: Verify Batch 7 collation and grapheme research vectors
        run: node --test scripts/test-unicode-batch7.mjs
      - name: Verify Batch 8 text segmentation and regex vectors
        run: node --test scripts/test-unicode-batch8.mjs
      - name: Verify Batch 9 grapheme editing, length and font references
        run: node --test scripts/test-unicode-batch9.mjs
      - name: Verify Batch 10 rendering, metrics and clipboard research
        run: node --test scripts/test-unicode-batch10.mjs
      - name: Verify Batch 11 Unicode markup, text export, bidi and locale conformance
        run: node --test scripts/test-unicode-batch11.mjs
